<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="catBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071124"/>
      <stop offset="50%" stop-color="#0b1934"/>
      <stop offset="100%" stop-color="#0f2347"/>
    </linearGradient>
    <linearGradient id="catEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Cat Ear on Top -->
  <polygon points="100,165 165,40 235,130" fill="#071124" stroke="#1e3a6a" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="125,150 168,70 215,130" fill="url(#catEarGrad)" opacity="0.85"/>

  <!-- Right Cat Ear on Top -->
  <polygon points="412,165 347,40 277,130" fill="#071124" stroke="#1e3a6a" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="387,150 344,70 297,130" fill="url(#catEarGrad)" opacity="0.85"/>

  <!-- Dark Blue Squircle Background Container -->
  <rect x="40" y="90" width="432" height="392" rx="92" fill="url(#catBgGrad)" stroke="#1e3a6a" stroke-width="8"/>
  <rect x="46" y="96" width="420" height="380" rx="86" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Ambient Blue Glow Behind Cart -->
  <circle cx="260" cy="280" r="130" fill="#0284c7" opacity="0.15" filter="url(#softGlow)"/>

  <!-- White Shopping Cart Icon -->
  <g id="whiteShoppingCart">
    <!-- Basket Outline & Handle -->
    <path d="M115 180 h55 l45 160 h175 l36 -112 h-232" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Basket Grid Dividers -->
    <line x1="236" y1="235" x2="396" y2="235" stroke="#ffffff" stroke-width="12" opacity="0.85" stroke-linecap="round"/>
    <line x1="252" y1="288" x2="376" y2="288" stroke="#ffffff" stroke-width="12" opacity="0.85" stroke-linecap="round"/>

    <!-- Trolley Wheels -->
    <circle cx="228" cy="396" r="28" fill="#ffffff"/>
    <circle cx="228" cy="396" r="10" fill="#071124"/>

    <circle cx="380" cy="396" r="28" fill="#ffffff"/>
    <circle cx="380" cy="396" r="10" fill="#071124"/>
  </g>
</svg>