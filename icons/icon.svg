<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="talaMidnightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061024"/>
      <stop offset="50%" stop-color="#0a1d40"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="talaEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="talaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Cat Ear on Top -->
  <polygon points="100,165 165,38 235,130" fill="#061024" stroke="#1e3a6a" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="125,150 168,68 215,130" fill="url(#talaEarGrad)" opacity="0.85"/>

  <!-- Right Cat Ear on Top -->
  <polygon points="412,165 347,38 277,130" fill="#061024" stroke="#1e3a6a" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="387,150 344,68 297,130" fill="url(#talaEarGrad)" opacity="0.85"/>

  <!-- Midnight Blue Squircle Background Container -->
  <rect x="40" y="90" width="432" height="392" rx="92" fill="url(#talaMidnightBg)" stroke="#1e3a6a" stroke-width="8"/>
  <rect x="46" y="96" width="420" height="380" rx="86" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- Ambient Sky Blue Glow Behind Bag -->
  <circle cx="256" cy="300" r="130" fill="#0284c7" opacity="0.18" filter="url(#talaGlow)"/>

  <!-- White Shopping Bag (Tala - Tas Belanja) -->
  <g id="talaShoppingBag">
    <!-- Bag Handle Loop (Above Bag Body) -->
    <path d="M208 215 V160 C208 126 304 126 304 160 V215" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

    <!-- Bag Body (Trapezoidal Tote Bag Silhouette) -->
    <path d="M150 215 L178 435 L334 435 L362 215 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

    <!-- Top Rim Fold of Bag -->
    <path d="M148 215 L364 215" stroke="#0a1d40" stroke-width="8" stroke-linecap="round" opacity="0.2"/>

    <!-- Handle Fasteners (Stitches on Bag Body) -->
    <circle cx="208" cy="245" r="7" fill="#0a1d40" opacity="0.45"/>
    <circle cx="304" cy="245" r="7" fill="#0a1d40" opacity="0.45"/>

    <!-- Cute Tala Accent on Bag Center (Cat Whiskers & Nose Minimalist Line) -->
    <g transform="translate(256, 335)">
      <!-- Nose -->
      <polygon points="0,0 -8,-10 8,-10" fill="#0284c7"/>
      <!-- Mouth line -->
      <path d="M-6,3 Q0,8 6,3" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <!-- Whiskers -->
      <line x1="-36" y1="-8" x2="-14" y2="-5" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <line x1="-38" y1="4" x2="-14" y2="2" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <line x1="14" y1="-5" x2="36" y2="-8" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <line x1="14" y1="2" x2="38" y2="4" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>
</svg>